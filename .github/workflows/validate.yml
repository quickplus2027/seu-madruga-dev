name: Validate Skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline structural validation
        run: python tests/validate_skill.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Compile offline tools
        run: python -m py_compile tools/madruga.py tools/quality_gates.py
